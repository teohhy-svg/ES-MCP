services:
  elasticsearch:
    image: ${ELASTICSEARCH_DOCKER_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.17.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  es-mcp-server:
    build: .
    profiles: ["server"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_READ_ONLY: "true"
      ES_ENABLE_WRITE_TOOLS: "false"
      ES_ENABLE_DESTRUCTIVE_TOOLS: "false"
      ES_INDEX_ALLOWLIST: "*"
      ES_INDEX_DENYLIST: ".*, .security*, .kibana*, .fleet*, .tasks, .async-search*"
      ES_MCP_LOG_FORMAT: json
    depends_on:
      elasticsearch:
        condition: service_healthy
